name: Crear APK de Imperio Clicker

on:
  workflow_dispatch:
  push:
    paths:
      - 'ImperioClickerAndroid_CORREGIDO.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto corregido
        run: unzip ImperioClickerAndroid_CORREGIDO.zip

      - name: Compilar APK
        run: |
          cd ImperioClickerAndroid_FIXED
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ImperioClicker-APK
          path: ImperioClickerAndroid_FIXED/app/build/outputs/apk/debug/app-debug.apk
